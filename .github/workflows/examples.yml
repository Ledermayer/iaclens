name: Examples
on:
  pull_request:
  workflow_dispatch:
    inputs:
      results_only:
        description: Verify a generated-results commit without live calls or republishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  examples:
    name: Examples gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ !inputs.results_only && github.actor != 'dependabot[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && 'live-examples' || 'offline-examples' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build -o work/iaclens ./cmd/iaclens
          go build -o work/exampletest ./cmd/exampletest
      - name: Clear previous generated reports
        if: ${{ !inputs.results_only }}
        run: rm -rf examples/*/results
      - name: Offline checks (required)
        id: offline
        continue-on-error: true
        run: |
          failed=0
          for example in reusable-module single-deployment module-library multi-deployment mixed-repository custom-policy; do
            ./work/exampletest --example "$example" --mode offline --bin work/iaclens || failed=1
          done
          exit "$failed"
      - name: Live assessments (advisory)
        if: >-
          !cancelled() && !inputs.results_only && steps.offline.outcome != 'skipped' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
        run: |
          if [[ -z "$LLM_GATEWAY_API_KEY" ]]; then
            echo 'Live assessments skipped: API credential unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for example in reusable-module single-deployment module-library multi-deployment mixed-repository custom-policy; do
            if ! timeout 180 ./work/exampletest --example "$example" --mode jev --bin work/iaclens; then
              echo "::warning::Live assessment for $example failed or timed out; this does not block merging."
              echo "Live assessment for **$example** failed or timed out (advisory)." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload all example results
        id: results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-results-${{ github.run_attempt }}
          path: examples/*/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Results and merge decision
        if: always()
        env:
          OFFLINE: ${{ steps.offline.outcome }}
          RESULTS_URL: ${{ steps.results.outputs.artifact-url }}
        run: |
          {
            echo '## Example results'
            echo "[Download all JSON and YAML reports]($RESULTS_URL)"
            echo 'Extract into examples/ to restore each example results/ folder.'
            echo "Offline checks: **$OFFLINE** (required). Live assessments are advisory."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$OFFLINE" = success
  publish:
    name: Save reports to PR branch
    needs: examples
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download reports without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          rm -rf examples/*/results
          gh run download "$RUN_ID" --name "example-results-$ATTEMPT" --dir examples
      - name: Commit reports and verify the new head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          if [[ "$current" != "$EXPECTED_SHA" ]]; then
            echo 'Branch changed during analysis; a newer run owns its results.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- examples/*/results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh example results'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          # GITHUB_TOKEN pushes do not trigger push/PR workflows. Explicit dispatch
          # checks the generated commit without recursively publishing more reports.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run examples.yml --ref "$BRANCH" -f results_only=true
          echo 'Reports committed under examples/*/results/ on the PR branch; verification dispatched.' >> "$GITHUB_STEP_SUMMARY"

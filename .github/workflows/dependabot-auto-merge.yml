name: Dependabot merge policy
on:
  pull_request:
    paths:
      - 'cmd/dependabotmerge/**'
      - '.github/workflows/dependabot-auto-merge.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Merge eligible updates (main only); otherwise preview
        type: boolean
        default: false
permissions: {}
concurrency:
  group: dependabot-merge-policy
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Ledermayer/iaclens' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && !inputs.apply))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Preview dependency decisions without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/dependabotmerge
  reconcile:
    if: >-
      github.repository == 'Ledermayer/iaclens' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPENDABOT_AUTOMERGE_ENABLED != 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.apply)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Merge only verified eligible updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/dependabotmerge --apply